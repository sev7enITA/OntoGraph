name: Verify OntoGraph

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m ontograph validate examples/aurora-21.json
      - run: python -m ontograph demo
      - name: Verify the weighted Finance examples and public impact reports
        run: |
          python -m ontograph weighted-impact examples/weighted/finance-close.json posting-object
          python -m examples.weighted.build_demo
          git diff --exit-code -- site/weights/
      - name: Exercise standalone customer adoption
        run: python examples/hub_pilot/standalone.py "$RUNNER_TEMP/standalone-evidence"
      - name: Generate offline evidence demo
        if: matrix.python == '3.13'
        run: |
          mkdir out
          python -m ontograph demo --report out/aurora.json --html out/aurora.html
      - name: Publish workflow artifact
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ontograph-aurora-demo
          path: |
            out/aurora.html
            out/aurora.json
          if-no-files-found: error
