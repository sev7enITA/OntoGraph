<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Relationship evidence · OnToGraPh Studio</title><link rel="stylesheet" href="./style.css"><script type="module" src="./decisions.js"></script></head>
<body><header><a id="back" href="../">← Studio</a><strong>OnToGraPh</strong><a id="language" href="?lang=zh-Hans">简体中文</a></header><main>
<h1 id="title">Relationship evidence</h1><p id="subtitle">Assess the consequences of a change, compare source judgments and record a review.</p>
<div id="controls" hidden><section><div class="bar"><h2 id="workspace-label">Draft workspace</h2><span id="version"></span></div>
<form id="navigation"><label><span id="workspace-name">Workspace ID</span><input name="workspace" required pattern="[a-z][a-z0-9_\-]{0,63}" maxlength="64" value="wbs"></label><button id="open">Open</button></form>
<form id="asof"><label><span id="asof-label">Model effective time (UTC)</span><input id="effective" required maxlength="20"></label><button id="set-time">Apply time</button></form>
<div class="bar"><label for="import" class="btn" id="import-label">Import model</label><input hidden type="file" id="import" accept=".json,application/json"><button id="export">Export JSON</button><button id="save" class="primary">Save draft</button></div><p id="scope"></p></section>
<div class="columns"><section><h2 id="editor-label">Relationship review</h2><label><span id="edge-label">Relationship</span><select id="edge"></select></label><form id="edit"></form></section>
<section><h2 id="impact-label">Decision impact</h2><label><span id="origin-label">Change origin</span><select id="origin"></select></label><label class="require"><input id="required" type="checkbox"><span id="required-label">Require complete assessments for this origin at release</span></label><div id="result" aria-live="polite"></div></section></div></div>
<p id="notice" role="status">Opening your private workspace…</p></main></body></html>
